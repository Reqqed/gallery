<header><h1>Моя коллекция</h1></header>
<main class="lab-content"><p>Соберите свой каталог работ. Записи сохраняются после обновления страницы в этом браузере.</p>
<form id="itemForm" novalidate><h2 id="formHeading">Добавить работу</h2><div class="field"><label for="title">Название</label><input id="title" name="title" type="text"  aria-describedby="title-error"><small class="error" id="title-error" aria-live="polite"></small></div><div class="field"><label for="artist">Автор</label><input id="artist" name="artist" type="text"  aria-describedby="artist-error"><small class="error" id="artist-error" aria-live="polite"></small></div><div class="field"><label for="year">Год</label><input id="year" name="year" type="number" min="1" step="1" aria-describedby="year-error"><small class="error" id="year-error" aria-live="polite"></small></div><div class="field"><label for="category">Категория</label><select id="category"><option>Живопись</option><option>Графика</option><option>Фотография</option></select></div><div class="field"><label><input type="checkbox" id="available" checked> Доступна для выставки</label></div>
<button type="submit" id="saveButton">Добавить</button> <button type="button" id="cancelEdit" hidden>Отменить редактирование</button><p id="itemError" class="error" role="alert"></p></form>
<p id="storageStatus" role="status"></p>
<div class="collection-tools"><label for="search">Поиск по названию или автору</label><input id="search" type="search"><label for="filter">Категория</label><select id="filter"><option value="">Все категории</option><option>Живопись</option><option>Графика</option><option>Фотография</option></select></div>
<p id="count" role="status"></p><div id="items" class="collection-grid"></div></main>
<footer>Малая галерея · Учебный проект</footer>
<script src="js/collection.js" defer></script>
<script src="js/magnifier.js" defer></script>
</body>
